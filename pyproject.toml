[project]
name = "safe-zhihu-mcp"
version = "1.0.0"
description = "Hardened read-only Zhihu MCP server with an isolated browser profile"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "playwright>=1.56.0,<2",
    "mcp>=1.20.0,<2",
    "platformdirs>=4.3.0,<5",
]

[project.scripts]
safe-zhihu-mcp = "mcp_server:main"
safe-zhihu-login = "login:main"

[project.optional-dependencies]
dev = [
    "PyYAML>=6.0,<7",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["zhihu_mcp*"]

[tool.setuptools]
py-modules = ["mcp_server", "login"]
