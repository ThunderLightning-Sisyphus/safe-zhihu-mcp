[project]
name = "zhihu-mcp"
version = "0.1.0"
description = "MCP server for Zhihu — lets AI agents interact with zhihu.com"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.40.0",
    "mcp>=1.0.0",
    "pycookiecheat>=0.7.0",
    "rookiepy>=0.5.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
zhihu-mcp = "mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["zhihu_mcp*"]
